name: jasna

on:
  workflow_run:
    workflows: ["jasna-build"]
    types:
      - completed
  workflow_dispatch:

env:
  BUILD_VERSION: "13.0.3"
  JASNA_VERSION: "v0.6.0-alpha5"
  ALIYUN_IMAGE_NAME: registry.cn-qingdao.aliyuncs.com/wod/cuda
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jasna

jobs:
  jasna-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: read

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Compile Binary Using Builder Environment
        run: |
          docker pull ${{ env.GHCR_IMAGE_NAME }}:${{ env.JASNA_VERSION }}-build
          docker run --rm \
            -v ${{ github.workspace }}:/app/jasna \
            -w /app/jasna \
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.JASNA_VERSION }}-build \
            /bin/bash .drone/build.sh
          
          # 提取编译产物
          cp -r ./dist_linux/jasna ./dist_jasna
          
          # 删除 build 镜像，释放磁盘空间给后续 runtime 构建
          docker rmi ${{ env.GHCR_IMAGE_NAME }}:${{ env.JASNA_VERSION }}-build
          docker system prune -f

      - name: Build and push jasna runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.drone/dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ALIYUN_IMAGE_NAME }}:${{ env.BUILD_VERSION }}-jasna-${{ env.JASNA_VERSION }}
          build-args: |
            BASE=nvidia/cuda:${{ env.BUILD_VERSION }}-runtime-ubuntu24.04
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}-jasna-${{ env.JASNA_VERSION }}

      - name: Build complete
        run: echo "CUDA ${{ env.BUILD_VERSION }}-jasna-${{ env.JASNA_VERSION }} pushed successfully to Aliyun!"

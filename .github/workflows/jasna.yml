name: jasna

on:
  push:
    branches:
      - release

env:
  BUILD_VERSION: "13.0.3"
  JASNA_VERSION: "v0.12.0"
  ALIYUN_IMAGE_NAME: registry.cn-qingdao.aliyuncs.com/wod/cuda
  GHCR_IMAGE_NAME: ghcr.io/mengkzhaoyun/jasna

jobs:
  jasna-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push jasna runtime image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .drone/dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.JASNA_VERSION }}
          build-args: |
            BASE=${{ env.GHCR_IMAGE_NAME }}:${{ env.JASNA_VERSION }}-build
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}-jasna-${{ env.JASNA_VERSION }}

      - name: Sync jasna runtime image to Aliyun Container Registry
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy --retry-times 5 \
            docker://${{ env.GHCR_IMAGE_NAME }}:${{ env.JASNA_VERSION }} \
            docker://${{ env.ALIYUN_IMAGE_NAME }}:${{ env.BUILD_VERSION }}-jasna-${{ env.JASNA_VERSION }}

      - name: Build complete
        run: echo "CUDA ${{ env.BUILD_VERSION }}-jasna-${{ env.JASNA_VERSION }} pushed successfully to GHCR and Aliyun!"

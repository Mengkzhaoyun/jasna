<text x="781" y="1063" font-size="18" fill="#2563eb" font-weight="600" text-anchor="middle">VAE Encode + Denoise → 共享 LatentStore</text>
<path d="M781 1078 V1094" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="446" y="1094" width="670" height="64" rx="10" fill="#ffffff" stroke="#dce5ed" stroke-width="1.5"/>
<text x="466" y="1121" font-size="20" fill="#172b40" font-weight="650" text-anchor="start">VAE Decode → 羽化融合 → NVENC 输出修复分片</text>
<text x="466" y="1146" font-size="16" fill="#52657a" font-weight="400" text-anchor="start">{span_idx:04d}-raw.nut</text>
<path d="M229 1158 V1206 H600" fill="none" stroke="#087f72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M781 1158 V1206 H600" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

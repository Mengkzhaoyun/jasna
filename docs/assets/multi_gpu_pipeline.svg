<text x="548" y="987" font-size="16" fill="#52657a" font-weight="400" text-anchor="middle">cuda:0</text>
<rect x="679" y="934" width="204" height="68" rx="8" fill="#ffffff" stroke="#c9d9f8" stroke-width="1.5"/>
<text x="781" y="962" font-size="20" fill="#2563eb" font-weight="650" text-anchor="middle">GPU 1</text>
<text x="781" y="987" font-size="16" fill="#52657a" font-weight="400" text-anchor="middle">cuda:1</text>
<rect x="912" y="934" width="204" height="68" rx="8" fill="#ffffff" stroke="#c9d9f8" stroke-width="1.5"/>
<text x="1014" y="962" font-size="20" fill="#2563eb" font-weight="650" text-anchor="middle">GPU K−1</text>
<text x="1014" y="987" font-size="16" fill="#52657a" font-weight="400" text-anchor="middle">cuda:K−1</text>
<path d="M548 1002 V1014 H1014 V1002" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M781 1002 V1034" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>

<rect x="64" y="1584" width="1072" height="40" rx="7" fill="#eaf3f8" stroke="none" stroke-width="1.5"/>
<text x="600" y="1611" font-size="19" fill="#172b40" font-weight="600" text-anchor="middle">最终视频 · 保留未修复区域与原始音轨信息</text>

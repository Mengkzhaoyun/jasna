<rect x="64" y="1234" width="1072" height="64" rx="10" fill="#ffffff" stroke="#dce5ed" stroke-width="1.5"/>
<text x="600" y="1261" font-size="20" fill="#172b40" font-weight="650" text-anchor="middle">分片与轨迹原子提交 · 已完成结果可复用</text>
<text x="600" y="1286" font-size="17" fill="#52657a" font-weight="400" text-anchor="middle">临时文件 + fsync + 原子重命名 · 轨迹 .done / 潜变量 .final.pt / 分片 .nut</text>
<path d="M600 1298 V1354" fill="none" stroke="#8295a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="1354" width="1120" height="290" rx="10" fill="#fafcfe" stroke="#dce5ed" stroke-width="1.5"/>
<rect x="64" y="1376" width="40" height="34" rx="7" fill="#eaf1fd" stroke="none" stroke-width="1.5"/>
<text x="84" y="1400" font-size="19" fill="#2563eb" font-weight="650" text-anchor="middle">03</text>
<text x="120" y="1401" font-size="24" fill="#172b40" font-weight="650" text-anchor="start">标准化、无损拼接与混流</text>
<text x="64" y="1432" font-size="17" fill="#52657a" font-weight="400" text-anchor="start">等待全部分片就绪 · 按原视频时间顺序组装</text>
<rect x="64" y="1450" width="312" height="102" rx="10" fill="#ffffff" stroke="#dce5ed" stroke-width="1.5"/>
<text x="84" y="1482" font-size="21" fill="#172b40" font-weight="650" text-anchor="start">分片标准化</text>
<text x="84" y="1513" font-size="18" fill="#52657a" font-weight="400" text-anchor="start">补齐关键帧头部参数</text>
<text x="84" y="1538" font-size="16" fill="#52657a" font-weight="400" text-anchor="start">normalize_fragment()</text>
<rect x="432" y="1450" width="312" height="102" rx="10" fill="#ffffff" stroke="#dce5ed" stroke-width="1.5"/>
<text x="452" y="1482" font-size="21" fill="#172b40" font-weight="650" text-anchor="start">视频流无损拼接</text>
<text x="452" y="1513" font-size="18" fill="#52657a" font-weight="400" text-anchor="start">精确时长清单 · -c:v copy</text>
<text x="452" y="1538" font-size="16" fill="#52657a" font-weight="400" text-anchor="start">concatenate_fragments()</text>
<rect x="800" y="1450" width="336" height="102" rx="10" fill="#ffffff" stroke="#dce5ed" stroke-width="1.5"/>
<text x="820" y="1482" font-size="21" fill="#172b40" font-weight="650" text-anchor="start">原始音轨与元数据混流</text>
<text x="820" y="1513" font-size="18" fill="#52657a" font-weight="400" text-anchor="start">保留音轨、字幕与章节</text>
<text x="820" y="1538" font-size="16" fill="#52657a" font-weight="400" text-anchor="start">mux_final_output()</text>
<path d="M376 1501 H432" fill="none" stroke="#8295a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M744 1501 H800" fill="none" stroke="#8295a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
